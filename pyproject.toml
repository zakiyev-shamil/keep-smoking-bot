[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-party-bot"
version = "0.1.0"
description = "Telegram-first party event system for office teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy[asyncio]>=2.0.36,<3",
    "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "hypothesis>=6.100,<7",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.format]
quote-style = "double"
