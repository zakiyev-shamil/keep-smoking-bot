services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: office_party
      POSTGRES_USER: office_party
      POSTGRES_PASSWORD: office_party
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office_party -d office_party"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.main"]
    restart: unless-stopped

volumes:
  postgres_data:
